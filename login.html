<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | Sedco Asesores</title>
    
    <link rel="icon" type="image/png" href="img/2025_Sedco_Asesores_Isotipo_Azul_Cuadrado.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-dark: #0f172a;
            --primary-blue: #1e3a8a;
            --accent-blue: #2563eb;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-header i {
            font-size: 2.5rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        .brand-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
            margin-top: 1.5rem;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .error-alert {
            display: none;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            align-items: center;
            gap: 8px;
        }

        .footer-note {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <i class="fa-solid fa-scale-balanced"></i>
            <h1>Sedco Asesores</h1>
            <p>Plataforma Interna de Gestión de Expedientes</p>
        </div>

        <div class="error-alert" id="errorAlert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorTexto">Credenciales inválidas</span>
        </div>

        <form id="formLogin">
            <div class="form-group">
                <label>Usuario o Correo Corporativo</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="inputUsuario" placeholder="usuario o usuario@sedcoasesores.com" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="inputPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="footer-note">
            Acceso restringido exclusivamente a personal autorizado.<br>
            Sedco Asesores Jurídicos y Fiscales.
        </div>
    </div>

    <script>
        // Detección automática: Local vs Producción
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:3000/api'
            : 'https://sedco-backend.onrender.com/api'; // Reemplaza con tu URL asignada en Render

        // Redirigir si ya tiene sesión activa
        if (localStorage.getItem('sedco_token')) {
            window.location.href = 'dashboard.html';
        }

        const form = document.getElementById('formLogin');
        const btnSubmit = document.getElementById('btnSubmit');
        const errorAlert = document.getElementById('errorAlert');
        const errorTexto = document.getElementById('errorTexto');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';

            const usuario = document.getElementById('inputUsuario').value.trim();
            const password = document.getElementById('inputPassword').value;

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando credenciales...';

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    localStorage.setItem('sedco_token', data.token);
                    localStorage.setItem('sedco_user', JSON.stringify(data.usuario));
                    window.location.href = 'dashboard.html';
                } else {
                    errorTexto.innerText = data.message || 'Credenciales incorrectas.';
                    errorAlert.style.display = 'flex';
                }
            } catch (err) {
                errorTexto.innerText = 'No se pudo conectar con el servidor. Verifica tu conexión.';
                errorAlert.style.display = 'flex';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>Ingresar al Sistema</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        });
    </script>
</body>
</html>
